# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Commit message used by `git commit` during repository initialization
init_commit_message: "[Spec Kit] Initial commit"

# When `/speckit-git-pr` runs, squash all feature-branch commits into a single
# commit (against the merge-base with the PR base) before pushing. Useful for
# keeping `main`'s history flat. If the branch was already pushed, the squashed
# branch is force-pushed with --force-with-lease.
squash_before_pr: true

# Copy the tracking issue's labels onto the PR that /speckit-git-pr opens
# (priority, kind, layer — the triage /speckit-git-issue already applied).
# `autopilot:*` labels are always skipped: they are picker run-state, not a
# description of the change. Labels are applied after the PR exists, so a label
# the repo does not know is a warning, never a lost PR.
pr_copy_labels: true

# Append an "Agent session" footer to the PR body naming the Claude Code session
# that produced the branch (`claude --resume <id>`, the git author, and the
# claude.ai session link when the session was bridged), so a
# reviewer can continue the work locally. Read from the environment, never from
# the agent. No-ops outside an agent session.
pr_session_footer: true

# Paths the auto-commit hook must never stage, and that /speckit-git-pr resets
# to HEAD before opening a PR.
#
# For repo-tracked generated artifacts whose canonical copy is rebuilt on the
# default branch by CI. lead-drop's `graphify-out/` is the motivating case: a
# 440k-line dated snapshot that the graphify lifecycle hook regenerates every
# phase. Letting `git add .` sweep it onto a feature branch made the PR diff
# unreviewable and every later rebase conflict on it — one branch showed
# "440920 insertions(+), 88677 deletions(-)" (issue #22).
#
# Listing a path here keeps the hook running (the artifact stays accurate for the
# rest of the session) while its output stays out of the branch entirely.
#
# Empty by default — nothing is excluded unless you say so.
commit_exclude: []
# commit_exclude:
#   - graphify-out

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "[Spec Kit] Save progress before clarification"
  before_plan:
    enabled: false
    message: "[Spec Kit] Save progress before planning"
  before_tasks:
    enabled: false
    message: "[Spec Kit] Save progress before task generation"
  before_implement:
    enabled: false
    message: "[Spec Kit] Save progress before implementation"
  before_checklist:
    enabled: false
    message: "[Spec Kit] Save progress before checklist"
  before_analyze:
    enabled: false
    message: "[Spec Kit] Save progress before analysis"
  before_taskstoissues:
    enabled: false
    message: "[Spec Kit] Save progress before issue sync"
  after_constitution:
    enabled: false
    message: "[Spec Kit] Add project constitution"
  after_specify:
    enabled: false
    message: "[Spec Kit] Add specification"
  after_clarify:
    enabled: false
    message: "[Spec Kit] Clarify specification"
  after_plan:
    enabled: false
    message: "[Spec Kit] Add implementation plan"
  after_tasks:
    enabled: false
    message: "[Spec Kit] Add tasks"
  after_implement:
    enabled: false
    message: "[Spec Kit] Implementation progress"
  after_checklist:
    enabled: false
    message: "[Spec Kit] Add checklist"
  after_analyze:
    enabled: false
    message: "[Spec Kit] Add analysis report"
  after_taskstoissues:
    enabled: false
    message: "[Spec Kit] Sync tasks to issues"
